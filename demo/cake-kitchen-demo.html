<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cake Kitchen — build a cake, get the real one</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF0F1; --surface:#FFFFFF; --surface-2:#FFF7F7; --ink:#3A221E; --muted:#8C6B65; --line:#F0DCDD;
  --plum:#3A221E; --plum-dark:#1E0F0C; --on-primary:#FFF7F2; --pink:#E0457B; --pink-dark:#B02D5C; --mint:#7FA85A; --butter:#F3CF74;
  --wall:#F6E1E4; --tile:#EFD0D5; --belt:#3A221E; --belt-2:#5A3A34; --plate:#E9D6D6; --plate-top:#FFFFFF;
  --lock:#C4ADA9; --danger:#B3263E; --sponge:#EFC98E; --cream:#FFFBF6;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; --pixel:"Silkscreen", ui-monospace, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1110; --surface:#271917; --surface-2:#2F201D; --ink:#FBEDEA; --muted:#C7A9A3; --line:#43302C;
    --plum:#F6D9D2; --plum-dark:#B99A93; --on-primary:#2A1714; --wall:#2E1F1D; --tile:#3A2825; --plate:#5A4541; --plate-top:#7A625D; --lock:#6E5A56;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1110; --surface:#271917; --surface-2:#2F201D; --ink:#FBEDEA; --muted:#C7A9A3; --line:#43302C;
  --plum:#F6D9D2; --plum-dark:#B99A93; --on-primary:#2A1714; --wall:#2E1F1D; --tile:#3A2825; --plate:#5A4541; --plate-top:#7A625D; --lock:#6E5A56;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:var(--display); font-size:16px; line-height:1.45;
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink); outline-offset:2px}
.app{max-width:460px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg)}
@media (min-width:700px){ body{background:
  radial-gradient(circle at 20% 20%, var(--tile) 0 2px, transparent 3px) 0 0/28px 28px, var(--bg)}
  .app{box-shadow:0 0 0 1px var(--line); background:var(--bg)} }

/* header */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; background:var(--bg); border-bottom:1px solid var(--line)}
.brand{border:0; background:none; padding:0; display:flex; white-space:nowrap; align-items:center; gap:8px; font-weight:800; font-size:19px; letter-spacing:-.02em; color:var(--ink)}
.brand svg{width:26px; height:26px}
.brand small{font-weight:600; font-size:12px; color:var(--muted)}
@media (max-width:420px){ .brand small{display:none} .brand{font-size:18px} }
.link{white-space:nowrap}
.top-actions{display:flex; gap:6px; align-items:center}
.link{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 12px; font-weight:600; font-size:14px}
.icon-btn{border:1px solid var(--line); background:var(--surface); border-radius:999px; width:34px; height:34px; display:grid; place-items:center; font-size:16px}

main{flex:1; display:flex; flex-direction:column}
.pad{padding:18px 16px 28px}
h1{font-size:30px; line-height:1.1; margin:6px 0 10px; font-weight:800; letter-spacing:-.01em}
h2{font-size:22px; line-height:1.2; margin:4px 0 6px; font-weight:800}
h3{font-size:17px; margin:18px 0 8px; font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* arcade buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:16px; padding:12px 18px;
  font-weight:700; font-size:17px; background:var(--plum); color:var(--on-primary); box-shadow:0 5px 0 var(--plum-dark);
  transition:transform .08s, box-shadow .08s; width:100%}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--plum-dark)}
.btn.pink{background:var(--pink); box-shadow:0 5px 0 var(--pink-dark)}
.btn.pink:active{box-shadow:0 1px 0 var(--pink-dark)}
.btn.ghost{background:var(--surface); color:var(--ink); box-shadow:0 5px 0 var(--line); border:1px solid var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn[disabled]{opacity:.45; pointer-events:none}
.btn.sm{padding:8px 12px; font-size:15px; border-radius:12px; width:auto; box-shadow:0 3px 0 var(--plum-dark)}
.btn.sm.ghost{box-shadow:0 3px 0 var(--line)}
.btn.sm.pink{box-shadow:0 3px 0 var(--pink-dark)}
.stack{display:grid; gap:14px}

/* chips */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:2px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 13px; font-weight:600; font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--plum); background:var(--plum); color:var(--on-primary)}

/* landing */
.hero-stage{position:relative; height:250px; background:var(--wall); overflow:hidden; border-bottom:1px solid var(--line)}
.tiles{position:absolute; inset:0; background:
  linear-gradient(var(--tile) 2px, transparent 2px) 0 0/34px 34px,
  linear-gradient(90deg, var(--tile) 2px, transparent 2px) 0 0/34px 34px; opacity:.8}
.note-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px}
.pill{background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:14px; font-weight:600}

/* stage */
.kit-top{position:sticky; top:calc(55px + env(safe-area-inset-top,0px)); z-index:10}
.stage{position:relative; height:250px; background:var(--wall); overflow:hidden; flex:none}
.window{position:absolute; top:16px; right:18px; width:74px; height:58px; border-radius:10px; border:5px solid var(--surface);
  background:linear-gradient(#BFE6FF,#E8F6FF); box-shadow:inset 0 0 0 2px var(--tile)}
.window::after{content:""; position:absolute; left:50%; top:0; bottom:0; width:4px; margin-left:-2px; background:var(--surface)}
.shelf{position:absolute; top:88px; right:12px; width:96px; height:6px; border-radius:3px; background:var(--plum)}
.shelf span{position:absolute; bottom:6px; font-size:18px}
.belt{position:absolute; left:0; right:0; bottom:0; height:34px; background:
  repeating-linear-gradient(90deg, var(--belt) 0 18px, var(--belt-2) 18px 36px); border-top:6px solid #2A1E38}
.belt.moving{animation:belt .5s linear}
@keyframes belt{to{background-position:-72px 0}}
.cake-wrap{position:absolute; left:0; right:0; bottom:8px; height:236px; display:flex; justify-content:center}
.cake-wrap.slide{animation:slidein .5s cubic-bezier(.3,1.2,.5,1)}
@keyframes slidein{from{transform:translateX(-60px)}to{transform:none}}
.cake-svg{width:100%; max-width:330px; height:100%; overflow:visible}
.cake-svg .tp{cursor:pointer}

/* halmeoni */
.halmeoni{position:absolute; left:10px; top:10px; right:108px; display:flex; gap:8px; align-items:flex-start; z-index:3}
.halmeoni .face{flex:none; width:40px; height:40px; border-radius:12px; background:var(--butter); display:grid; place-items:center; font-size:24px; box-shadow:0 3px 0 #D9A92E}
.bubble{background:var(--surface); border:2px solid var(--ink); border-radius:12px; padding:6px 10px; font-size:14px; line-height:1.3; font-weight:600;
  position:relative; animation:bub .3s ease-out}
.bubble::before{content:""; position:absolute; left:-8px; top:12px; border:6px solid transparent; border-right-color:var(--ink)}
@keyframes bub{from{transform:scale(.9); opacity:0}to{transform:none; opacity:1}}
.combo{position:absolute; left:50%; top:42%; transform:translateX(-50%); font-family:var(--pixel); font-size:20px; color:var(--pink);
  text-shadow:2px 2px 0 var(--ink); z-index:4; animation:combo .9s ease-out forwards; pointer-events:none; white-space:nowrap}
@keyframes combo{0%{transform:translate(-50%,10px) scale(.6); opacity:0}30%{transform:translate(-50%,0) scale(1.15); opacity:1}100%{transform:translate(-50%,-30px) scale(1); opacity:0}}

/* stations bar */
.stations{display:flex; gap:4px; padding:8px 10px; overflow-x:auto; background:var(--surface); border-bottom:1px solid var(--line)}
.st{flex:1 0 auto; min-width:40px; text-align:center; font-size:11px; font-weight:700; color:var(--muted); padding:4px 2px; border-radius:10px}
.st b{display:block; font-size:18px; line-height:1.2; filter:grayscale(1); opacity:.55}
.st.done b{filter:none; opacity:.9}
.st.on{background:var(--plum); color:var(--on-primary)}
.st.on b{filter:none; opacity:1}

/* oven + box overlays */
.overlay{position:absolute; inset:0; display:grid; place-items:center; z-index:5}
.oven{width:190px; height:150px; border-radius:18px; background:#6E7686; box-shadow:0 8px 0 #4C5261; position:relative; animation:ovenin .3s ease-out}
.oven .door{position:absolute; left:20px; right:20px; top:34px; bottom:18px; border-radius:10px; background:#2D2233; overflow:hidden}
.oven .door::after{content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 80%, #FFB347, #FF6B2C 45%, transparent 75%); animation:glow .5s ease-in-out infinite alternate}
.oven .knobs{position:absolute; top:10px; left:22px; display:flex; gap:10px}
.oven .knobs i{width:14px; height:14px; border-radius:50%; background:#D9DDE6; display:block}
.oven .timer{position:absolute; top:8px; right:20px; font-family:var(--pixel); font-size:12px; color:#FFD45E}
@keyframes glow{from{opacity:.55}to{opacity:1}}
@keyframes ovenin{from{transform:scale(.7); opacity:0}to{transform:none; opacity:1}}
.box-front{position:absolute; bottom:14px; left:50%; width:240px; margin-left:-120px; height:170px; background:#FFF4E8; border:4px solid var(--pink);
  border-radius:10px; animation:boxup .5s cubic-bezier(.3,1.3,.5,1) both}
.box-lid{position:absolute; bottom:180px; left:50%; width:260px; margin-left:-130px; height:28px; background:var(--pink); border-radius:8px; animation:lid .45s .45s cubic-bezier(.3,1.5,.5,1) both}
.box-bow{position:absolute; bottom:196px; left:50%; transform:translateX(-50%); font-size:40px; animation:bow .4s .85s ease-out both}
.box-front::after{content:""; position:absolute; left:50%; top:0; bottom:0; width:18px; margin-left:-9px; background:var(--pink)}
@keyframes boxup{from{transform:translateY(200px)}to{transform:none}}
@keyframes lid{from{transform:translateY(-200px)}to{transform:none}}
@keyframes bow{from{transform:translateX(-50%) scale(0) rotate(-40deg)}to{transform:translateX(-50%) scale(1)}}

/* svg animations */
.drop{animation:drop .5s cubic-bezier(.3,1.6,.5,1) both; transform-box:fill-box; transform-origin:center bottom}
@keyframes drop{from{transform:translateY(-110px); opacity:0}50%{opacity:1}to{transform:none}}
.tierdrop{animation:tierdrop .6s cubic-bezier(.3,1.4,.5,1) both}
@keyframes tierdrop{from{transform:translateY(-170px)}to{transform:none}}
.pour{animation:pour .7s ease-out both; transform-box:fill-box; transform-origin:center bottom}
@keyframes pour{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.rise{animation:rise .7s cubic-bezier(.3,1.5,.5,1) both; transform-box:fill-box; transform-origin:center bottom}
@keyframes rise{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.sweep{animation:sweep .65s ease-out both}
@keyframes sweep{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.grow{animation:grow .35s cubic-bezier(.3,1.6,.5,1) both; transform-box:fill-box; transform-origin:center bottom}
@keyframes grow{from{transform:scaleX(.8)}to{transform:none}}

/* panel */
.panel{flex:1; padding:14px 14px 110px; background:var(--surface-2)}
.panel h2{margin-bottom:2px}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px}
.grid.two{grid-template-columns:repeat(2,1fr)}
.tile{position:relative; border:2px solid var(--line); background:var(--surface); border-radius:16px; padding:10px 6px 8px; min-height:92px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-align:center; font-weight:700; font-size:14px; line-height:1.15}
.tile .sw{width:34px; height:34px; border-radius:50%; border:2px solid rgba(0,0,0,.12)}
.tile .em{font-size:30px; line-height:1}
.tile .ko{font-size:12px; color:var(--muted); font-weight:600}
.tile .pr{font-size:12px; color:var(--muted); font-weight:600}
.tile[aria-pressed="true"]{border-color:var(--plum); box-shadow:0 0 0 3px color-mix(in srgb, var(--plum) 25%, transparent)}
.tile.locked{background:var(--surface-2); color:var(--lock)}
.tile.locked .sw,.tile.locked .em{filter:grayscale(1); opacity:.45}
.tile .lk{position:absolute; top:6px; right:8px; font-size:13px}
.tile .why{font-size:12px; text-decoration:underline; color:var(--muted); font-weight:700}
.tile .cnt{position:absolute; top:-7px; right:-7px; background:var(--pink); color:#fff; min-width:22px; height:22px; border-radius:11px; font-size:13px; display:grid; place-items:center; padding:0 5px}
.bigaction{margin-top:16px}
.textin{width:100%; border:2px solid var(--line); background:var(--surface); border-radius:14px; padding:10px 12px; font-size:17px; font-weight:600}
.textin:focus{border-color:var(--plum); outline:none}

/* bottom bar */
.bar{position:fixed; left:0; right:0; bottom:0; z-index:15; background:var(--surface); border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:432px; margin:0 auto; display:flex; gap:10px; align-items:center}
.price{flex:1; line-height:1.1}
.price b{display:block; font-size:22px; font-weight:800}
.price span{font-size:13px; color:var(--muted); font-weight:600}
.bar .btn{width:auto; min-width:110px}

/* cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px}
.bk{display:grid; grid-template-columns:62px 1fr; gap:12px; align-items:start}
.bk .pic{width:62px; height:62px; border-radius:16px; display:grid; place-items:center; font-size:30px}
.bk h3{margin:0 0 2px}
.badge{display:inline-block; font-size:12px; font-weight:800; padding:2px 8px; border-radius:999px; margin-right:4px}
.badge.ok{background:color-mix(in srgb, var(--mint) 22%, transparent); color:#167A57}
.badge.self{background:color-mix(in srgb, var(--butter) 35%, transparent); color:#8A6200}
.badge.plain{background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .badge.ok{color:#7FE7C0} :root:not([data-theme="light"]) .badge.self{color:#FFD45E} }
.meta{font-size:14px; color:var(--muted); font-weight:600}
.notice{background:color-mix(in srgb, var(--butter) 25%, transparent); border-radius:12px; padding:8px 10px; font-size:14px; font-weight:600; margin-top:8px}

/* modal + toast */
.modal-bg{position:fixed; inset:0; background:rgba(20,10,30,.5); z-index:40; display:grid; place-items:end center; padding:16px}
.modal{background:var(--surface); border-radius:22px; padding:18px; width:100%; max-width:430px; animation:up .25s ease-out;
  margin-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(40px); opacity:0}to{transform:none; opacity:1}}
.toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg);
  padding:10px 14px; border-radius:14px; font-weight:700; font-size:15px; z-index:50; max-width:90vw; animation:up .2s ease-out}

/* result */
.result-stage{position:relative; height:280px; background:var(--wall); overflow:hidden}
.spin{animation:spin 1.4s cubic-bezier(.4,.1,.3,1) both; transform-origin:center}
@keyframes spin{from{transform:perspective(600px) rotateY(0)}to{transform:perspective(600px) rotateY(360deg)}}
.confetti i{position:absolute; top:-12px; width:9px; height:14px; border-radius:2px; animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(320px) rotate(540deg); opacity:.2}}
.stars{display:flex; gap:10px; justify-content:center; margin:10px 0 4px}
.star{text-align:center; font-size:13px; font-weight:700; color:var(--muted); width:92px}
.star b{display:block; font-size:34px; line-height:1.1; animation:starpop .4s cubic-bezier(.3,1.8,.5,1) both}
.star.off b{filter:grayscale(1); opacity:.35}
@keyframes starpop{from{transform:scale(0)}to{transform:none}}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:12px 0}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:8px 4px; text-align:center}
.stat b{display:block; font-size:18px}
.stat span{font-size:12px; color:var(--muted); font-weight:600}
.rows{display:grid; gap:4px; font-size:15px}
.rows div{display:flex; justify-content:space-between; gap:10px}
.rows .tot{font-weight:800; font-size:19px; border-top:1px dashed var(--line); padding-top:6px; margin-top:4px}
.rows .disc{color:var(--mint); font-weight:700}

/* form */
label.f{display:grid; gap:4px; font-weight:700; font-size:15px}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.err{color:var(--danger); font-size:14px; font-weight:700}

/* tracking */
.steps{list-style:none; padding:0; margin:12px 0; display:grid; gap:0}
.steps li{display:grid; grid-template-columns:34px 1fr; gap:10px; align-items:center; padding:6px 0; color:var(--muted); font-weight:700}
.steps li .dot{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--surface); border:2px solid var(--line); font-size:16px}
.steps li.done{color:var(--ink)}
.steps li.done .dot{background:var(--mint); border-color:var(--mint)}
.steps li.now{color:var(--ink)}
.steps li.now .dot{background:var(--butter); border-color:var(--butter); animation:bounce .8s ease-in-out infinite alternate}
@keyframes bounce{to{transform:translateY(-4px)}}
.vs{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.vs figure{margin:0; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:8px; text-align:center}
.vs figcaption{font-size:13px; font-weight:700; color:var(--muted)}
.photo{background:#EFE6DA; border-radius:10px; filter:saturate(1.15) contrast(1.05)}
.photo .cake-svg{filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.pixel{image-rendering:pixelated; background:var(--wall); border-radius:10px}

/* dashboard */
.ord{display:grid; gap:8px}
.ord-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.ord-top b{font-size:18px}
.status{font-size:12px; font-weight:800; padding:3px 9px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line)}
.status.received{background:var(--butter); color:#5A4200; border-color:transparent}
.status.declined{background:#F7D3DA; color:#8E1F35; border-color:transparent}
.status.delivered,.status.pickedup{background:var(--mint); color:#0D4E37; border-color:transparent}
.ord-body{display:grid; grid-template-columns:110px 1fr; gap:10px; align-items:center}
.mini{height:96px; background:var(--wall); border-radius:12px; overflow:hidden}
.mini .cake-svg{height:100%}
.ing{font-size:13px; color:var(--muted); font-weight:600}
.act{display:flex; gap:8px; flex-wrap:wrap}
.suggest{display:grid; grid-template-columns:110px 1fr; gap:12px; align-items:center}


/* ===== landing ===== */
.lp{padding-bottom:30px}
.lp-hero{position:relative; margin:14px 14px 0; border-radius:28px; overflow:hidden; background:var(--wall); aspect-ratio:360/300}
.lp-hero > svg{display:block; width:100%; height:100%}
.lp-hud{position:absolute; top:14px; left:16px; right:16px; transition:opacity .25s; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none}
.lp-hud .stage-l{font-family:var(--pixel); font-size:11px; color:var(--muted); line-height:1.3}
.lp-hud .stage-l b{display:block; font-family:var(--display); font-size:15px; color:var(--ink); font-weight:700; letter-spacing:-.01em; transition:opacity .2s}
.lp-hud .score{font-family:var(--pixel); font-size:13px; background:var(--surface); color:var(--ink); border-radius:999px; padding:3px 10px; box-shadow:0 2px 0 var(--line)}
.lp-tag{position:absolute; left:16px; top:14px; display:flex; gap:10px; align-items:center; background:var(--surface); border-radius:16px; padding:8px 12px 8px 8px;
  box-shadow:0 6px 18px rgba(58,34,30,.14); opacity:0; transform:translateY(12px); transition:opacity .35s, transform .45s cubic-bezier(.3,1.4,.5,1)}
.lp-tag.on{opacity:1; transform:none}
.lp-hero.tagging .lp-hud{opacity:0}
.lp-tag .dot{width:34px; height:34px; border-radius:10px; background:var(--wall); display:grid; place-items:center}
.lp-tag b{display:block; font-size:14px; line-height:1.15}

/* hero scene animation */
#heroSvg .h-pan,#heroSvg .h-batter,#heroSvg .h-stream,#heroSvg .h-nozzle,#heroSvg .h-cake,#heroSvg .h-plate,#heroSvg .h-frost,#heroSvg .h-rose,#heroSvg .h-drop,#heroSvg .h-candle,#heroSvg .h-score{opacity:0}
#heroSvg .h-oven{transform:translateY(-300px)}
#heroSvg .h-all{transition:opacity .4s}
#heroSvg.s-out .h-all{opacity:0}
#heroSvg.s-pan .h-pan{opacity:1; animation:hPanIn .9s cubic-bezier(.2,.9,.3,1.15) both}
#heroSvg.s-pan .h-stripes{animation:hBelt .9s cubic-bezier(.2,.9,.3,1) both}
#heroSvg.s-pour .h-nozzle{opacity:1; animation:hNozzle 1.4s ease both}
#heroSvg.s-pour .h-stream{animation:hStream 1.25s .15s ease both; transform-box:fill-box; transform-origin:center top}
#heroSvg.s-pour .h-batter{opacity:1; animation:hFill .9s .35s cubic-bezier(.3,1.3,.5,1) both; transform-box:fill-box; transform-origin:center}
#heroSvg.s-oven .h-oven{transform:none; animation:hOvenDown .6s cubic-bezier(.3,1.35,.5,1) both}
#heroSvg.s-baked .h-oven{transform:translateY(-300px); animation:hOvenUp .5s ease-in both}
#heroSvg.s-baked .h-pan,#heroSvg.s-baked .h-batter{opacity:0; animation:none}
#heroSvg.s-baked .h-plate{opacity:1}
#heroSvg.s-baked .h-cake{opacity:1; animation:hRise .75s .2s cubic-bezier(.3,1.55,.5,1) both; transform-box:fill-box; transform-origin:center bottom}
#heroSvg.s-cream .h-frost{opacity:1; animation:hSweep .75s ease-out both}
#heroSvg.s-rose .h-rose{opacity:1; animation:hPop .4s cubic-bezier(.3,1.9,.5,1) both; transform-box:fill-box; transform-origin:center}
#heroSvg.s-berry .h-drop{opacity:1; animation:hDrop .6s cubic-bezier(.3,1.6,.5,1) both; transform-box:fill-box; transform-origin:center bottom}
#heroSvg.s-candle .h-candle{opacity:1; animation:hDrop .6s cubic-bezier(.3,1.6,.5,1) both; transform-box:fill-box; transform-origin:center bottom}
#heroSvg.s-score .h-score{animation:hScore 1.8s ease-out both}
#heroSvg .h-flame{animation:hFlicker .16s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center bottom}
#heroSvg .h-glow{animation:hGlow .4s ease-in-out infinite alternate}
@keyframes hPanIn{from{transform:translateX(-280px)}to{transform:none}}
@keyframes hBelt{from{transform:translateX(-60px)}to{transform:none}}
@keyframes hNozzle{0%{transform:translateY(-80px); opacity:0}18%{transform:none; opacity:1}82%{transform:none; opacity:1}100%{transform:translateY(-80px); opacity:0}}
@keyframes hStream{0%{transform:scaleY(0); opacity:1}25%{transform:scaleY(1); opacity:1}75%{transform:scaleY(1); opacity:1}100%{transform:scaleY(1); opacity:0}}
@keyframes hFill{from{transform:scale(.15); opacity:0}to{transform:none; opacity:1}}
@keyframes hOvenDown{from{transform:translateY(-300px)}to{transform:none}}
@keyframes hOvenUp{from{transform:none}to{transform:translateY(-300px)}}
@keyframes hRise{from{transform:scaleY(.35)}to{transform:none}}
@keyframes hSweep{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes hPop{from{transform:scale(0)}to{transform:none}}
@keyframes hDrop{from{transform:translateY(-150px); opacity:0}35%{opacity:1}to{transform:none; opacity:1}}
@keyframes hScore{0%{opacity:0; transform:translateY(10px)}20%{opacity:1; transform:none}75%{opacity:1; transform:translateY(-6px)}100%{opacity:0; transform:translateY(-14px)}}
@keyframes hFlicker{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.12) rotate(3deg)}}
@keyframes hGlow{from{opacity:.55}to{opacity:1}}

@media (prefers-reduced-motion: reduce){

  if(!ing) return null;
  const a=ing.allergens||[];
  if(opts.has('halal') && ing.halal===false) return ing.halalNote||'Not halal.';
  if(opts.has('vegan') && ing.gelatin) return 'Contains animal gelatin, so it is not vegan.';
  if((opts.has('no_milk')||opts.has('vegan')) && a.includes('milk')) return 'Contains milk.';
  if((opts.has('no_egg')||opts.has('vegan')) && a.includes('egg')) return 'Contains egg.';
  if(opts.has('no_nuts') && (a.includes('peanut')||a.includes('tree_nut'))) return 'Contains peanuts.';
  if(opts.has('no_wheat') && a.includes('wheat')) return 'Contains wheat.';
  return null;
}

function priceOf(cake, bid){
  const b=BAKERIES.find(x=>x.id===bid)||BAKERIES[0];

  cake.layers.forEach((L,i)=>{
    if(i>0) p+=15000;

    if(L.frosting) p+=ALL[L.frosting].price;
    L.toppings.forEach(t=>p+=ALL[t.id].price);
  });
  if(cake.lettering) p+=2000;
  return Math.round(p*b.mult/100)*100;
}
function combosOf(cake){
  const ids=new Set();
  cake.layers.forEach(L=>{ if(L.batter) ids.add(L.batter); if(L.frosting) ids.add(L.frosting); L.toppings.forEach(t=>ids.add(t.id)); });
  return PAIRS.filter(p=>ids.has(p[0])&&ids.has(p[1]));

function statsOf(cake){
  const size=SIZES.find(s=>s.id===cake.size)||SIZES[1];
  let kcal=0,sugar=0,protein=0;
  cake.layers.forEach((L,i)=>{
    const f=i===0?1:.55;
    if(L.batter){kcal+=ALL[L.batter].kcal*f; sugar+=ALL[L.batter].sugar*f; protein+=ALL[L.batter].protein*f;}
    if(L.frosting){kcal+=ALL[L.frosting].kcal*f; sugar+=ALL[L.frosting].sugar*f; protein+=ALL[L.frosting].protein*f;}
    L.toppings.forEach(t=>{const x=ALL[t.id]; kcal+=x.kcal*3/size.serv; sugar+=x.sugar*3/size.serv; protein+=x.protein*3/size.serv;});
  });
  const c=combosOf(cake); const pos=c.filter(x=>x[2]>0).length, neg=c.filter(x=>x[2]<0).length;
  const lowSugar=state.opts.has('low_sugar');
  const goal= lowSugar ? sugar*.6<=15 : cake.layers.some(L=>L.toppings.length>0);
  const taste= neg===0 && (pos>0 || cake.layers.every(L=>L.frosting));
  const match=Math.max(55,Math.min(99,72+pos*9-neg*12+(goal?8:0)+(cake.lettering?3:0)));
  kcal*=.62; sugar*=.6; protein*=.7;
  return {kcal:Math.round(kcal),sugar:Math.round(sugar),protein:Math.round(protein),safe:true,taste,goal,match,lowSugar};
}

    o.type=type; o.frequency.value=f; g.gain.value=.05; o.connect(g); g.connect(actx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+d); o.stop(actx.currentTime+d+.02);}catch(e){}
}

let svgUid=0;
function shade(hex,amt){ // amt -1..1
  const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255;
  const t=amt<0?0:255, p=Math.abs(amt);
  r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function tierSVG(shape,cx,yb,h,w,body,top,uid,shadeOn=true){
  const yt=yb-h, ry=Math.max(9,w*.1);
  const sh=shadeOn?`fill="url(#sh${uid})"`:'fill="none"';
  if(shape==='square'){
    const L=cx-w/2, R=cx+w/2-16, d=ry*1.6;
    const bodySvg=`<rect x="${L}" y="${yt}" width="${R-L}" height="${h}" fill="${body}"/>
      <polygon points="${R},${yt} ${R+16},${yt-d} ${R+16},${yb-d} ${R},${yb}" fill="${shade(body,-.22)}"/>
      <rect x="${L}" y="${yt}" width="${R-L}" height="${h}" ${sh}/>`;
    const topSvg=c=>`<polygon points="${L},${yt} ${L+16},${yt-d} ${R+16},${yt-d} ${R},${yt}" fill="${c}"/>`;
    return {bodySvg, topSvg, svg:bodySvg+topSvg(top), tx:cx, ty:yt-d/2, rx:(w-32)/2, ry:d/2, L, R, yt};
  }
  const bw= shape==='heart'? w*.9 : w;
  const L=cx-bw/2, R=cx+bw/2, rx=bw/2;
  const topSvg=c=>{
    if(shape!=='heart') return `<ellipse cx="${cx}" cy="${yt}" rx="${rx}" ry="${ry}" fill="${c}"/>`;
    const hw=w*.62, hy=ry*1.9;
    return `<ellipse cx="${cx}" cy="${yt}" rx="${rx}" ry="${ry}" fill="${shade(c,-.06)}"/>
      <path d="M${cx},${yt+hy*.55} C${cx-hw},${yt-hy*.1} ${cx-hw*.5},${yt-hy*1.05} ${cx},${yt-hy*.35} C${cx+hw*.5},${yt-hy*1.05} ${cx+hw},${yt-hy*.1} ${cx},${yt+hy*.55} Z" fill="${c}" stroke="${shade(c,-.12)}" stroke-width="1.5"/>`;
  };
  const bodySvg=`<path d="M${L},${yt} V${yb} A${rx},${ry} 0 0 0 ${R},${yb} V${yt} Z" fill="${body}"/>
    <path d="M${L},${yt} V${yb} A${rx},${ry} 0 0 0 ${R},${yb} V${yt} Z" ${sh}/>`;
  return {bodySvg, topSvg, svg:bodySvg+topSvg(top), tx:cx, ty:yt, rx, ry, L, R, yt};
}
function dripsSVG(L,R,yt,ry,color,seed){
  const n=8, seg=(R-L)/n; let d=`M${L},${yt} L${L},${yt+ry*.5}`;
  for(let j=0;j<n;j++){ const x0=L+j*seg, x1=x0+seg, dep=ry*.5+6+((j*7+seed*3)%4)*4;
    d+=` Q${x0+seg*.2},${yt+dep+6} ${x0+seg/2},${yt+dep} Q${x0+seg*.8},${yt+dep-8} ${x1},${yt+ry*.5}`; }
  d+=` L${R},${yt} Z`;
  return `<path d="${d}" fill="${color}"/>`;
}
function cakeSVG(cake,o={}){
  const uid=++svgUid, anim=o.anim||{}, size=SIZES.find(s=>s.id===cake.size)||SIZES[1];
  const cx=160, base=o.base||222; const parts=[];
  const plateW=(cake.shape?size.w:170)/2+30;
  parts.push(`<ellipse cx="${cx}" cy="${base+8}" rx="${plateW+4}" ry="14" fill="var(--plate)"/><ellipse cx="${cx}" cy="${base+4}" rx="${plateW}" ry="11" fill="var(--plate-top)"/>`);
  if(!cake.shape){
    parts.push(`<ellipse cx="${cx}" cy="${base-30}" rx="80" ry="12" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 6" opacity=".6"/>`);
  } else {
    let yb=base;
    cake.layers.forEach((L,i)=>{
      const w=size.w*Math.pow(.72,i);
      const cls=[]; if(anim.type==='tier'&&anim.layer===i) cls.push('tierdrop'); if(anim.type==='pan'&&i===0) cls.push('drop'); if(anim.type==='size'&&i===0) cls.push('grow');
      let g='';
      if(!L.baked){
        const h=26, panBody='#8E95A5', panTop='#C9CED8';
        const t=tierSVG(cake.shape,cx,yb,h,w,panBody,panTop,uid);
        g+=t.svg;
        if(L.batter){
          const inner=tierSVG(cake.shape,cx,yb-3,h-8,w*.86,ALL[L.batter].color,shade(ALL[L.batter].color,.18),uid,false);
          g+=`<g class="${anim.type==='pour'&&anim.layer===i?'pour':''}">${inner.svg}</g>`;
        }
        parts.push(`<g class="${cls.join(' ')}">${g}</g>`);
        yb=yb-h+4;
      } else {
        const h=44, bat=ALL[L.batter], fr=L.frosting?ALL[L.frosting]:null;
        const top=fr?fr.color:shade(bat.color,.2);
        const probe=tierSVG(cake.shape,cx,yb,h,w,bat.color,top,uid);
        let frost='';
        if(fr){ frost=`<g class="${anim.type==='frost'&&anim.layer===i?'sweep':''}">${dripsSVG(probe.L,probe.R,probe.yt,probe.ry,fr.color,i+1)}${probe.topSvg(fr.color)}</g>`; }
        g+=`<g class="${anim.type==='rise'&&anim.layer===i?'rise':''}">${probe.bodySvg}${probe.topSvg(shade(bat.color,.2))}</g>`+frost;
        // toppings
        const hasAbove=i<cake.layers.length-1;
        L.toppings.forEach((t,k)=>{
          let fx=t.fx, fy=t.fy;
          if(hasAbove && Math.abs(fx)<.78){ fx=(fx<0?-1:1)*(.8+Math.abs(fy)*.1); }
          const x=probe.tx+fx*probe.rx*.82, y=probe.ty+fy*probe.ry*.75+6;
          const fs=Math.max(14,20*Math.pow(.85,i));
          const isNew=anim.type==='top'&&anim.layer===i&&anim.k===k;
          g+=`<text class="tp ${isNew?'drop':''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${fs}" text-anchor="middle" ${o.interactive?`data-act="rmTop" data-v="${i}:${k}"`:''}>${t.e||ALL[t.id].e}</text>`;
        });
        parts.push(`<g class="${cls.join(' ')}">${g}</g>`);
        yb=probe.yt;
      }
    });
    // lettering on the front of the top baked tier
    const topI=cake.layers.length-1, TL=cake.layers[topI];
    if(cake.lettering && TL.baked){
      const w=size.w*Math.pow(.72,topI); let y=base; for(let i=0;i<topI;i++) y-=44;
      const bat=ALL[TL.batter]; const col=bat.dark?'#FFF1F7':'#D6336C';
      const txt=o.letterShown!=null?cake.lettering.slice(0,o.letterShown):cake.lettering;
      const fs=Math.max(10,Math.min(17,(w*.9)/Math.max(6,cake.lettering.length)*1.6));
      const lx=cake.shape==='square'?160-8:160;
      parts.push(`<text x="${lx}" y="${y-44/2+fs*.55+4}" font-size="${fs}" font-weight="800" text-anchor="middle" fill="${col}" font-family="Bricolage Grotesque, sans-serif">${esc(txt)}</text>`);
    }
  }
  return `<svg class="cake-svg" viewBox="${o.crop?'40 70 240 180':'0 0 320 250'}" role="img" aria-label="${esc(o.label||'Cake preview')}" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="sh${uid}" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient></defs>
    ${parts.join('')}</svg>`;
}

/* ================= STORE (db capability with local fallback) ================= */
let dbApi=null, sampleApi=null;
const local={orders:[],subs:new Set()};
function loadLocal(){ try{ local.orders=JSON.parse(localStorage.getItem('ck_orders')||'[]'); }catch(e){ local.orders=[]; } }
function saveLocal(){ try{ localStorage.setItem('ck_orders',JSON.stringify(local.orders)); }catch(e){} local.subs.forEach(f=>f(local.orders)); }
loadLocal();
window.addEventListener('storage',e=>{ if(e.key==='ck_orders'){ loadLocal(); local.subs.forEach(f=>f(local.orders)); } });
const store={
  async add(o){
    if(dbApi){ try{ await dbApi.collection('orders').doc(o.id).set(o); return; }catch(e){ console.warn('db write failed, using this device only',e); dbApi=null; } }
    local.orders.unshift(o); saveLocal();
  },
  async update(id,patch){
    if(dbApi){ try{ await dbApi.doc('orders/'+id).update(patch); return; }catch(e){ console.warn(e); } }
    const o=local.orders.find(x=>x.id===id); if(o){ Object.assign(o,patch); saveLocal(); }
  },
  watchAll(fn){
    if(dbApi){ try{ return dbApi.collection('orders').orderBy('createdAt','desc').limit(40).onSnapshot(
      s=>fn(s.docs.map(d=>Object.assign({},d.data(),{id:d.id}))), e=>{ console.warn(e); local.subs.add(fn); fn(local.orders); }); }catch(e){} }
    local.subs.add(fn); fn(local.orders); return ()=>local.subs.delete(fn);
  },
  watchOne(id,fn){
    const w=list=>fn(list.find(x=>x.id===id)||null);
    if(dbApi){ try{ return dbApi.doc('orders/'+id).onSnapshot(s=>{ const d=s.data(); if(d) fn(Object.assign({},d,{id})); else w(local.orders); }, e=>{ local.subs.add(w); w(local.orders); }); }catch(e){} }
    local.subs.add(w); w(local.orders); return ()=>local.subs.delete(w);
  }
};
function rewatch(){
  if(unsub){ try{unsub();}catch(e){} unsub=null; }
  if(state.view==='dashboard') unsub=store.watchAll(list=>{ state.orders=list; if(state.view==='dashboard') render(); });
  if(state.view==='tracking' && state.orderId) unsub=store.watchOne(state.orderId,o=>{ if(o) state.order=o; if(state.view==='tracking') render(); });
}
(async()=>{
  try{
    if(window.claude && typeof window.claude.use==='function'){
      const [d,s]=await Promise.all([window.claude.use('db').catch(()=>null), window.claude.use('sample').catch(()=>null)]);
      dbApi=d; sampleApi=s; rewatch();
    }
  }catch(e){}
})();

let heroTimers=[];
function stopHero(){ heroTimers.forEach(clearTimeout); heroTimers=[]; }
function runHero(){
  stopHero();
  const svg=document.getElementById('heroSvg'); if(!svg) return;
  const lab=document.getElementById('hudLabel'), num=document.getElementById('hudStage'), sc=document.getElementById('hudScore'), tag=document.getElementById('heroTag');
  const all=HERO_STEPS.map(x=>x[1]);
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ svg.classList.add(...all); lab.textContent='Perfect cake'; num.textContent='STAGE 6/6'; sc.textContent='★ 100'; tag.classList.add('on'); return; }
  svg.classList.remove(...all,'s-out'); tag.classList.remove('on');
  let stage=0;
  HERO_STEPS.forEach(([t,cls,label,score])=>{
    heroTimers.push(setTimeout(()=>{
      svg.classList.add(cls);
      if(label){ stage=Math.min(6,stage+1); lab.textContent=label; num.textContent=`STAGE ${stage}/6`; }
      sc.textContent='★ '+String(score).padStart(3,'0');
      if(cls==='s-tag'){ tag.classList.add('on'); svg.parentNode.classList.add('tagging'); }
    },t));
  });
  heroTimers.push(setTimeout(()=>{ svg.classList.add('s-out'); tag.classList.remove('on'); svg.parentNode.classList.remove('tagging'); },10800));
  heroTimers.push(setTimeout(runHero,11300));
}

function startKitchen(){ state.cake=freshCake(); state.step={layer:0,i:0,phase:'build'}; state.preset=null; go('kitchen'); }
function advance(){
  const s=state.step; const list=s.phase==='finish'?['lettering','box']:stationsFor(s.layer);
  if(s.phase==='build' && list[s.i]==='toppings'){ modal='layer'; render(); return; }
  if(s.i<list.length-1){ s.i++; state.tip=null; renderStage(); moveBelt(); }
}
function goBack(){
  const s=state.step;
  if(s.i>0){ s.i--; state.tip=null; renderStage(); return; }
  if(s.phase==='finish'){ s.phase='build'; s.layer=state.cake.layers.length-1; s.i=stationsFor(s.layer).length-1; renderStage(); return; }
  if(s.layer>0){ state.cake.layers.pop(); s.layer--; s.i=stationsFor(s.layer).length-1; state.tip='Took that layer off. Back to the one below.'; renderStage(); return; }
  go('bakeries');
}
function checkCombos(before){
  const after=combosOf(state.cake);
  const fresh=after.find(p=>!before.some(q=>q[0]===p[0]&&q[1]===p[1]));
  if(fresh){ state.tip=fresh[3]; return fresh[2]>0; }
  return false;
}
function presetCake(p){
  const cake={shape:'round',size:'m',lettering:'',layers:[{batter:p.batter,baked:true,frosting:p.frosting,toppings:[]}]};
  rngSeed=p.name.length*17+3;

  cake.layers[0].toppings=p.toppings.map((id,k)=>{ const ang=(k/n)*Math.PI*2+.4; const r=n>1?.55:0; return {id,fx:Math.cos(ang)*r,fy:Math.sin(ang)*r*.8}; });
  return cake;
}
function safeSwap(id,list){
  const x=ALL[id]; if(x && !lockReason(x)) return id;
  const alt=list.find(y=>!lockReason(y)&&y.tags.some(t=>x&&x.tags.includes(t)))||list.find(y=>!lockReason(y));
  return alt?alt.id:null;
}
function localSuggest(){
  const a=state.ai;
  const scored=PRESETS.map(p=>{
    const q={...p, batter:safeSwap(p.batter,BATTERS), frosting:safeSwap(p.frosting,FROSTINGS), toppings:p.toppings.filter(t=>!lockReason(ALL[t]))};
    let sc=0; a.cravings.forEach(c=>{ if(p.tags.includes(c)) sc+=3; }); if(a.sweet) sc-=Math.abs(a.sweet-p.sweet)*2;
    if(state.opts.has('low_sugar')) sc-=p.sweet;
    const hits=p.tags.filter(t=>a.cravings.has(t)).map(t=>CRAVINGS.find(c=>c[0]===t)[1].toLowerCase());
    const sweetTxt=a.sweet?SWEET.find(s=>s[0]===a.sweet)[1].toLowerCase()+' sweetness':'';
    q.reason=p.desc+' '+(hits.length?`Picked for ${hits.join(' and ')}${sweetTxt?', '+sweetTxt:''}.`:(sweetTxt?`Picked for ${sweetTxt}.`:''));
    return {q,sc};
  }).filter(x=>x.q.batter&&x.q.frosting).sort((x,y)=>y.sc-x.sc).slice(0,3).map(x=>x.q);
  return scored;
}

  const el=e.target.closest('[data-act]'); if(!el||!app.contains(el)) return;
  if(el.disabled) return;
  const fn=actions[el.dataset.act]; if(fn){ e.preventDefault(); fn(el.dataset.v,el,e); }
});
app.addEventListener('input',e=>{
  if(e.target.id==='letterIn'){ state.cake.lettering=e.target.value; const w=document.getElementById('cakeWrap'); if(w) w.innerHTML=cakeSVG(state.cake,{interactive:true}); updateBar(); }
  if(e.target.id==='aiText'){ state.ai.text=e.target.value; }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&modal){ modal=null; render(); } });

render();
</script>
</body>
</html>
